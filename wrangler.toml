name = "infosys"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# src/style.css 以文本模块方式打包进 Worker（页面样式）
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "infosys-db"
database_id = "PLACEHOLDER_D1_ID"

# 可选：会话默认存 D1 的 sessions 表。若日后建好 KV 命名空间，
# 取消下面注释并填入 id，会话会自动改走 KV（代码已适配）。
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "..."
